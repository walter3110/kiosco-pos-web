<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Kiosco POS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="marca">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M3 4h18l1 5c0 1.4-1.1 2.5-2.5 2.5S17 10.4 17 9c0 1.4-1.1 2.5-2.5 2.5S12 10.4 12 9c0 1.4-1.1 2.5-2.5 2.5S7 10.4 7 9c0 1.4-1.1 2.5-2.5 2.5S2 10.4 2 9l1-5zm1 9h16v7h-5v-5H9v5H4v-7z"/></svg>
      <h1 id="negocio">Mi Kiosco</h1>
    </div>
    <div class="top-der">
      <button class="campana" id="campana" title="Productos para reponer">🔔<span class="badge oculto" id="badge"></span></button>
      <div class="cajero"><span class="txt" id="cajero-txt"></span><span class="avatar" id="cajero-ini"></span></div>
    </div>
  </header>

  <main id="main">
    <div class="encabezado"><h2 id="titulo">Venta actual</h2><p id="subtitulo"></p></div>
    <div id="app"></div>
  </main>

  <nav class="tabs">
    <button data-tab="vender" class="activo"><span>🛒</span>Vender</button>
    <button data-tab="productos"><span>📦</span>Productos</button>
    <button data-tab="fiado"><span>📒</span>Fiado</button>
    <button data-tab="caja"><span>💵</span>Caja</button>
    <button data-tab="mas"><span>📊</span>Más</button>
  </nav>

  <div id="modal" class="modal oculto"><div class="modal-caja" id="modal-contenido"></div></div>
  <div id="toast" class="toast oculto"></div>

  <script src="app.js"></script>
</body>
</html>
