<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <title>Kiosco POS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="titulo">Vender</h1>
    <span id="negocio" class="negocio"></span>
  </header>

  <main id="app"></main>

  <nav class="tabs">
    <button data-tab="vender" class="activo"><span>🛒</span>Vender</button>
    <button data-tab="productos"><span>📦</span>Productos</button>
    <button data-tab="fiado"><span>📒</span>Fiado</button>
    <button data-tab="caja"><span>💵</span>Caja</button>
    <button data-tab="mas"><span>📊</span>Más</button>
  </nav>

  <div id="modal" class="modal oculto"><div class="modal-caja" id="modal-contenido"></div></div>
  <div id="toast" class="toast oculto"></div>

  <script src="app.js"></script>
</body>
</html>
