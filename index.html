<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13233f">
  <title>WRC tech · Punto de venta</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
  <header class="topbar">
    <div class="marca">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M3 4h18l1 5c0 1.4-1.1 2.5-2.5 2.5S17 10.4 17 9c0 1.4-1.1 2.5-2.5 2.5S12 10.4 12 9c0 1.4-1.1 2.5-2.5 2.5S7 10.4 7 9c0 1.4-1.1 2.5-2.5 2.5S2 10.4 2 9l1-5zm1 9h16v7h-5v-5H9v5H4v-7z"/></svg>
      <h1 id="negocio">Mi Kiosco</h1>
    </div>
    <div class="top-der">
      <span class="reloj" id="reloj"></span>
      <button class="campana" id="campana" title="Productos para reponer">🔔<span class="badge oculto" id="badge"></span></button>
      <div class="cajero"><span class="txt" id="cajero-txt"></span><span class="avatar" id="cajero-ini"></span></div>
    </div>
  </header>

  <main id="main">
    <div class="encabezado"><h2 id="titulo">Venta actual</h2><p id="subtitulo"></p></div>
    <div id="app"></div>
  </main>

  <nav class="tabs">
    <div class="nav-marca"><b>WRC <span>tech</span></b><small>Punto de venta</small></div>
    <button data-tab="vender" class="activo"><span>🛒</span><i>Vender</i><kbd>Alt+1</kbd></button>
    <button data-tab="productos"><span>📦</span><i>Productos</i><kbd>Alt+2</kbd></button>
    <button data-tab="caja"><span>💵</span><i>Caja</i><kbd>Alt+3</kbd></button>
    <button data-tab="mas"><span>📊</span><i>Reportes</i><kbd>Alt+4</kbd></button>
  </nav>

  <div id="modal" class="modal oculto"><div class="modal-caja" id="modal-contenido"></div></div>
  <div id="escaner" class="escaner oculto">
    <video id="esc-video" playsinline muted></video>
    <div class="esc-marco"></div>
    <div class="esc-pie">
      <div id="esc-estado">Abriendo cámara…</div>
      <div class="fila">
        <button class="btn gris" id="esc-manual">⌨ Escribir</button>
        <button class="btn cancelar" id="esc-cerrar">Cerrar</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast oculto"></div>

  <script src="app.js?v=12"></script>
</body>
</html>
